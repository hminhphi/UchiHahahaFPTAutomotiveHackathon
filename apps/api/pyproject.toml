[project]
name = "fleetiq-api"
version = "0.1.0"
description = "FleetIQ FastAPI control plane."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "fleetiq-contracts",
    "fleetiq-observability",
    "redis>=6,<7",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
]

[tool.uv.sources]
fleetiq-contracts = { workspace = true }
fleetiq-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetiq_api"]
