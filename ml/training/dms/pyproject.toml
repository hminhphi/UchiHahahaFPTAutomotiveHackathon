[project]
name = "fleetiq-training-dms"
version = "0.1.0"
description = "FleetIQ DMS training and evaluation workspace."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fleetiq-contracts",
    "torch>=2.0.0",
    "mediapipe>=0.10.0",
    "opencv-python>=4.8.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
]

[project.scripts]
fleetiq-train-dms = "fleetiq_training_dms.train:main"
fleetiq-evaluate-dms = "fleetiq_training_dms.evaluate:main"
fleetiq-predict-dms = "fleetiq_training_dms.predict:main"
fleetiq-download-dms = "fleetiq_training_dms.download_dataset:main"

[tool.uv.sources]
fleetiq-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetiq_training_dms"]
