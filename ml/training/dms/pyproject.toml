[project]
name = "fleetiq-training-dms"
version = "0.1.0"
description = "FleetIQ DMS training and evaluation workspace."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fleetiq-contracts",
]

[tool.uv.sources]
fleetiq-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetiq_training_dms"]
