[project]
name = "fleetiq-training-roadface"
version = "0.1.0"
description = "FleetIQ offline road-facing relabeling, training, and evaluation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fleetiq-data-kit",
    "fleetiq-roadface",
    "imageio>=2.36",
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pillow>=12.0",
]

[project.optional-dependencies]
models = [
    "accelerate>=1.0",
    "diffusers>=0.32",
    "peft>=0.12",
    "safetensors>=0.4",
    "scipy>=1.14",
    "timm>=1.0.11",
    "transformers==4.57.1",
    "ultralytics>=8.3",
]

[project.scripts]
fleetiq-label-roadface = "fleetiq_training_roadface.label_locateanything:main"
fleetiq-prepare-roadface = "fleetiq_training_roadface.prepare_dataset:main"
fleetiq-train-roadface = "fleetiq_training_roadface.train_models:main"
fleetiq-evaluate-roadface = "fleetiq_training_roadface.evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetiq_training_roadface"]

[tool.uv.sources]
fleetiq-data-kit = { workspace = true }
fleetiq-roadface = { workspace = true }
