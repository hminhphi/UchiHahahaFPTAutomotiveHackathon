[project]
name = "automotivehacathon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.10",
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pandas>=3.0",
    "pillow>=12.0",
]

[dependency-groups]
dev = [
    "paho-mqtt>=2.1,<3",
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "jsonschema>=4.23",
    "websockets>=15,<16",
]

[project.optional-dependencies]
cu130 = [
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]
roadface = [
    "accelerate>=1.0",
    "diffusers>=0.32",
    "decord==0.6.0",
    "imageio>=2.36",
    "lmdb>=1.7.5",
    "safetensors>=0.4",
    "scipy>=1.14",
    "tqdm>=4.66",
    "transformers==4.57.1",
    "tokenizers==0.22.0",
    "peft>=0.12",
    "timm>=1.0.11",
    "ultralytics>=8.3",
    "yacs>=0.1.8",
    "prefetch-generator>=1.0.3",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.workspace]
members = [
    "apps/*",
    "services/*",
    "packages/*",
    "ml/training/*",
    "infra/*",
]
exclude = [
    "apps/README.md",
    "apps/web",
    "apps/carsky-hmi",
    "services/README.md",
    "packages/README.md",
    "ml/training/README.md",
    "infra/README.md",
    "infra/compose",
    "infra/docker",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "tests",
    "apps/api/tests",
    "apps/carsky-hmi/carsky/bridge",
    "infra/aws/tests",
    "ml/sagemaker/dms/tests",
    "ml/training/roadface/tests",
    "packages/contracts/tests",
    "packages/data-kit/tests",
    "packages/model-clients/tests",
    "packages/observability/tests",
    "services/coaching-worker/tests",
    "services/dms-worker/tests",
    "services/event-gateway/tests",
    "services/fusion-worker/tests",
    "services/roadface-worker/tests",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["ml/notebooks"]

[tool.ruff.lint]
# Keep the CI gate focused on syntax, undefined names, and unused imports.
# Research/visualization utilities intentionally retain varied formatting.
select = ["E4", "E7", "E9", "F"]
