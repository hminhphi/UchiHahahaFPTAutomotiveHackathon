name: ${COMPOSE_PROJECT_NAME:-fleetiq}

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    <<: *service-defaults
    image: postgres:16-bookworm
    profiles: [core, perception, full]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleetiq}
      POSTGRES_USER: ${POSTGRES_USER:-fleetiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleetiq-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/compose/postgres/init.sql:/docker-entrypoint-initdb.d/10-fleetiq.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [backend]

  redis:
    <<: *service-defaults
    image: redis:7.4-bookworm
    profiles: [core, perception, full]
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  mosquitto:
    <<: *service-defaults
    image: eclipse-mosquitto:2.0
    profiles: [core, perception, full]
    ports:
      - "${FLEETIQ_MQTT_PORT:-1883}:1883"
    volumes:
      - ./infra/compose/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test:
        [
          CMD-SHELL,
          "mosquitto_pub -h 127.0.0.1 -t fleetiq/health -m ping",
        ]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 5s
    networks: [edge, backend]

  minio:
    <<: *service-defaults
    image: minio/minio:latest
    profiles: [core, perception, full]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${FLEETIQ_OBJECT_STORAGE_ACCESS_KEY:-fleetiq-local}
      MINIO_ROOT_PASSWORD: ${FLEETIQ_OBJECT_STORAGE_SECRET_KEY:-fleetiq-local-secret}
    ports:
      - "${FLEETIQ_MINIO_PORT:-9000}:9000"
      - "${FLEETIQ_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, curl, -f, http://127.0.0.1:9000/minio/health/live]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [edge, backend]

  minio-seed:
    image: minio/mc:latest
    profiles: [core, perception, full]
    restart: "no"
    environment:
      FLEETIQ_OBJECT_STORAGE_ACCESS_KEY: ${FLEETIQ_OBJECT_STORAGE_ACCESS_KEY:-fleetiq-local}
      FLEETIQ_OBJECT_STORAGE_SECRET_KEY: ${FLEETIQ_OBJECT_STORAGE_SECRET_KEY:-fleetiq-local-secret}
      FLEETIQ_OBJECT_STORAGE_BUCKET: ${FLEETIQ_OBJECT_STORAGE_BUCKET:-fleetiq-demo}
    volumes:
      - type: bind
        source: ./data
        target: /seed
        read_only: true
      - ./infra/compose/minio/seed.sh:/seed.sh:ro
    entrypoint: ["/bin/sh", "/seed.sh"]
    depends_on:
      minio:
        condition: service_healthy
    networks: [backend]

  api:
    <<: *service-defaults
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: [core, perception, full]
    environment:
      FLEETIQ_TESTING: "true"
      FLEETIQ_ALLOWED_ORIGINS: ${FLEETIQ_ALLOWED_ORIGINS:-http://localhost:3000}
      FLEETIQ_REDIS_URL: redis://redis:6379/0
      FLEETIQ_DATABASE_URL: postgresql://${POSTGRES_USER:-fleetiq}:${POSTGRES_PASSWORD:-fleetiq-local-only}@postgres:5432/${POSTGRES_DB:-fleetiq}
      FLEETIQ_REPLAY_ENABLED: "true"
      FLEETIQ_REPLAY_FPS: ${FLEETIQ_REPLAY_FPS:-10}
      FLEETIQ_MEDIA_BACKEND: s3
      FLEETIQ_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      FLEETIQ_OBJECT_STORAGE_BUCKET: ${FLEETIQ_OBJECT_STORAGE_BUCKET:-fleetiq-demo}
      FLEETIQ_OBJECT_STORAGE_ACCESS_KEY: ${FLEETIQ_OBJECT_STORAGE_ACCESS_KEY:-fleetiq-local}
      FLEETIQ_OBJECT_STORAGE_SECRET_KEY: ${FLEETIQ_OBJECT_STORAGE_SECRET_KEY:-fleetiq-local-secret}
    ports:
      - "${FLEETIQ_API_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ./data
        target: /data
        read_only: true
      - type: bind
        source: ./artifacts
        target: /artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      minio-seed:
        condition: service_completed_successfully
    networks: [edge, backend]

  web:
    <<: *service-defaults
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_WS_BASE_URL: ${NEXT_PUBLIC_WS_BASE_URL:-ws://localhost:8000}
    profiles: [core, perception, full]
    environment:
      FLEETIQ_API_BASE_URL: http://api:8000
    ports:
      - "${FLEETIQ_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]

  event-gateway:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/event-gateway/Dockerfile
    profiles: [core, perception, full]
    environment:
      FLEETIQ_MQTT_HOST: mosquitto
      FLEETIQ_MQTT_PORT: "1883"
      FLEETIQ_MQTT_TLS: "false"
    depends_on:
      mosquitto:
        condition: service_healthy
    networks: [backend]

  model-mock:
    <<: *service-defaults
    build:
      context: .
      dockerfile: infra/docker/model-mock/Dockerfile
    profiles: [perception, full]
    environment:
      MODEL_MOCK_PORT: "8080"
    ports:
      - "${FLEETIQ_MODEL_MOCK_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ./data
        target: /data
        read_only: true
      - type: bind
        source: ./artifacts
        target: /artifacts
    networks: [edge, backend]

  carsky-bridge:
    <<: *service-defaults
    build:
      context: apps/carsky-hmi/carsky/bridge
      dockerfile: Dockerfile
    profiles: [full]
    environment:
      BRIDGE_HOST: 0.0.0.0
      BRIDGE_PORT: "8090"
    ports:
      - "${FLEETIQ_CARSKY_BRIDGE_PORT:-8090}:8090"
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [edge]

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres-data:
  redis-data:
  mosquitto-data:
  minio-data:
