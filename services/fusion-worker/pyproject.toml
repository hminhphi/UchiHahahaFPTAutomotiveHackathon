[project]
name = "fleetiq-fusion-worker"
version = "0.1.0"
description = "FleetIQ deterministic risk fusion and scoring worker."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fleetiq-contracts",
]

[project.scripts]
fleetiq-fusion-worker = "fleetiq_fusion.main:main"

[tool.uv.sources]
fleetiq-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetiq_fusion"]
