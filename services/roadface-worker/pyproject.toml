[project]
name = "fleetiq-roadface"
version = "0.1.0"
description = "FleetIQ road-facing inference runtime worker."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fleetiq-contracts",
    "fleetiq-data-kit",
    "numpy>=2.0",
]

[project.optional-dependencies]
headless = [
    "opencv-python-headless>=4.10",
]

[project.scripts]
fleetiq-roadface = "fleetiq_roadface.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetiq_roadface"]

[tool.uv.sources]
fleetiq-contracts = { workspace = true }
fleetiq-data-kit = { workspace = true }
