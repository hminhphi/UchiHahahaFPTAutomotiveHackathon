[project]
name = "fleetiq-event-gateway"
version = "0.1.0"
description = "FleetIQ versioned MQTT event gateway."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fleetiq-contracts",
    "paho-mqtt>=2.1,<3",
    "pydantic>=2.11,<3",
]

[project.scripts]
fleetiq-event-gateway = "fleetiq_event_gateway.main:main"

[tool.uv.sources]
fleetiq-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetiq_event_gateway"]
