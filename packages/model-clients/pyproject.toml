[project]
name = "fleetiq-model-clients"
version = "0.1.0"
description = "Typed local and SageMaker inference adapters for FleetIQ."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fleetiq-contracts",
]

[tool.uv.sources]
fleetiq-contracts = { workspace = true }

[project.optional-dependencies]
aws = [
    "boto3>=1.35,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetiq_model_clients"]
