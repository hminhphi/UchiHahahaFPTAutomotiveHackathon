[project]
name = "fleetiq-data-kit"
version = "0.1.0"
description = "Stable Practice/KITTI/telemetry dataset access for FleetIQ."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetiq_data"]
