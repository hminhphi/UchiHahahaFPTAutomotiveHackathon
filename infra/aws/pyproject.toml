[project]
name = "fleetiq-infra"
version = "0.1.0"
description = "AWS CDK infrastructure for FleetIQ Guardian."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aws-cdk-lib>=2.260,<3",
    "constructs>=10.4,<11",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fleetiq_infra"]
